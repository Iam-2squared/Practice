name: Practice CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: practice-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: practice-ci-only
          POSTGRES_DB: practice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: practice-ci-only
      PGDATABASE: practice_test
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Supabase-like roles
        run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
      - run: psql -v ON_ERROR_STOP=1 -f db/bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/crypto_fx.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/price_charts.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/comments.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/ranking_activity.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/progression.sql
      - name: Original schema regression before upgrade
        run: |
          psql -v ON_ERROR_STOP=1 -f db/verify.sql
          psql -v ON_ERROR_STOP=1 -f db/smoke.sql
          psql -v ON_ERROR_STOP=1 -f db/progression_smoke.sql
      - name: Upgrade and verify repeatable additive migration
        run: |
          psql -v ON_ERROR_STOP=1 -f db/market_expansion.sql
          psql -v ON_ERROR_STOP=1 -f db/market_expansion.sql
      - name: Original regression and expanded catalog integration
        run: |
          psql -v ON_ERROR_STOP=1 -f db/verify.sql
          psql -v ON_ERROR_STOP=1 -f db/smoke.sql
          psql -v ON_ERROR_STOP=1 -f db/progression_smoke.sql
          psql -v ON_ERROR_STOP=1 -f db/market_expansion_smoke.sql
  mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Start isolated local server
        run: |
          node tests/ui-server.mjs > /tmp/practice-dev.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS 'http://localhost:3000/api/index?action=config' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/practice-dev.log
          exit 1
      - run: python tests/browser_smoke.py
      - run: python tests/progression_browser.py
      - run: python tests/localization_browser.py
      - run: python tests/market_favorites_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-evidence
          path: test-results/
          retention-days: 7
  public-deployment:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [app, database, mobile-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bilingual public assets and auth, no user writes
        run: node scripts/public-smoke.mjs
