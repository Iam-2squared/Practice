name: Practice CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: practice-ci-only
          POSTGRES_DB: practice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: practice-ci-only
      PGDATABASE: practice_test
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Supabase-like roles
        run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
      - run: psql -v ON_ERROR_STOP=1 -f db/bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/verify.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/smoke.sql
