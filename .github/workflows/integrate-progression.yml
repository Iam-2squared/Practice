name: Prepare progression source
on:
  push:
    branches: [feature/challenges-weekly-achievements]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/challenges-weekly-achievements
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed one-time source integration
        run: |
          python scripts/integrate_progression.py
          git diff --check
          npm run check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app.mjs lib/store.mjs public/app.js public/app.html tests/browser_smoke.py tests/ui-server.mjs tests/app.test.mjs package.json package-lock.json
          git commit -m 'feat: integrate challenges, weekly ranking and profile badges'
          git push origin HEAD:feature/challenges-weekly-achievements
