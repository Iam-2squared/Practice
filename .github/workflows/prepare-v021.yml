name: Prepare verified v0.2.1 source
on:
  push:
    branches: ['maintenance/prepare-v0.2.1']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact locally tested source
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          encoded = ''.join((root / ('.maintenance/v021.part' + str(i))).read_text() for i in (1, 2, 3))
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == '6a4595295e1d19f54030780b99bb124e49b750f3b0225c4edfa29f029948cc51'
          changes = json.loads(lzma.decompress(packed))
          assert len(changes) == 21
          subprocess.run(['git', 'checkout', '--detach', 'ecfc3333167be226be98abf8c03699a194d959fe'], check=True)
          assert subprocess.check_output(['git', 'write-tree']).decode().strip() == 'f9d374895f9b419ef791cfc93323db3f6e8ad502'
          for change in changes:
              rel = pathlib.PurePosixPath(change['path'])
              assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
              path = root / rel
              assert path.resolve().is_relative_to(root)
              old = path.read_text() if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest() == change['old_sha256'], str(rel)
              for start, end, text in reversed(change['edits']):
                  old = old[:start] + text + old[end:]
              assert hashlib.sha256(old.encode()).hexdigest() == change['new_sha256'], str(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(old)
          pathlib.Path('/tmp/practice-v021-paths.json').write_text(json.dumps([c['path'] for c in changes]))
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree == '3237e02738d42501b099b919c4bb5c36a7445af7', tree
          print('Verified source tree:', tree)
          PY
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Store verified source blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'Iam-2squared/Practice'
          endpoint = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs'
          for path in json.loads(pathlib.Path('/tmp/practice-v021-paths.json').read_text()):
              # Workflow objects are uploaded separately through the authorized connector.
              if path.startswith('.github/workflows/'):
                  continue
              content = pathlib.Path(path).read_bytes()
              expected = subprocess.check_output(['git', 'hash-object', path]).decode().strip()
              req = urllib.request.Request(endpoint, data=json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == expected
              print(path, expected)
          print('Verified non-workflow blobs saved. No refs, production settings or database rows were changed.')
          PY
